# Shifts — PWA estático (dist/) em /var/www/shifts.psoft.app.
# O certbot acrescenta o bloco 443 (certbot --nginx -d shifts.psoft.app).
server {
    listen 80;
    listen [::]:80;
    server_name shifts.psoft.app;

    root /var/www/shifts.psoft.app;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # index.html, sw.js, manifest: sempre conferir versão nova (atualização do PWA)
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome não mudam: cache longo
    location /assets/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
